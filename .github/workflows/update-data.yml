name: Atualizar Agenda da Matilha

on:
  schedule:
    - cron: '0 */6 * * *' # Roda a cada 6 horas
  workflow_dispatch: # Permite rodar manualmente clicando num botão

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-matches:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para salvar o arquivo no repositório

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Rodar Script de Atualização (Agenda e Resultados)
        env:
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
        run: node fetch-data.js

      - name: Atualizar dados de LoL (LoL Esports)
        env:
          LOLESPORTS_KEY: ${{ secrets.LOLESPORTS_KEY }}
        run: node fetch-lolesports.js

      - name: Buscar Notícias Externas
        run: node fetch-news.js

      - name: Salvar alterações (Commit & Push)
        run: |
          git config --global user.name 'Bot da Matilha'
          git config --global user.email 'bot@canalhasnews.com.br'
          git add data/matches.json data/results.json data/standings.json data/news_external.json
          git diff --cached --quiet || git commit -m "Atualizando agenda, resultados e notícias externas [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
